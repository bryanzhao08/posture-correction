name: FormCoach
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  FormCore:
    path: FormCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  FormCoach:
    type: application
    platform: iOS
    sources:
      - path: FormCoach
        excludes:
          - README.md
          - .verification
          - Verification
          - DebugFixtures
      # Fixtures may ship as resources, but replay code and settings exist only in DEBUG.
      - path: FormCoach/DebugFixtures
        buildPhase: resources
      - path: ../shared/cue_catalog.json
        buildPhase: resources
      - path: ../shared/sport_profiles.json
        buildPhase: resources
    dependencies:
      - package: FormCore
        product: FormCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formcoach.app
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FormCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - FormCoachUITests
  FormCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FormCoachUITests
        excludes:
          - Artifacts
      - path: FormCoach/Camera/OrangeMarkerTracker.swift
      - path: FormCoach/Demos/DemoMotion.swift
      - path: FormCoach/Demos/DemoMotionTable.swift
      - path: ../shared/cue_catalog.json
        buildPhase: resources
    dependencies:
      - target: FormCoach
      - package: FormCore
        product: FormCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formcoach.app.uitests
        GENERATE_INFOPLIST_FILE: YES
